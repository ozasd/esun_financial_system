services:
  postgres:
    image: postgres:16.14-alpine3.22
    container_name: esun-financial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esun_financial_system
      POSTGRES_USER: esun_app_user
      POSTGRES_PASSWORD: "EsunFinanceDB_2026!Secure"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./DB/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./DB/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./DB/04_indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esun_app_user -d esun_financial_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
