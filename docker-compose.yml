x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: esun_financial_system
    DB_USERNAME: esun_app_user
    DB_PASSWORD: "EsunFinanceDB_2026!Secure"
    SERVER_PORT: 8080
    REDIS_HOST: redis
    REDIS_PORT: 6379
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  networks:
    - sharednetwork

services:
  postgres:
    image: postgres:16.14-alpine3.22
    container_name: esun-financial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esun_financial_system
      POSTGRES_USER: esun_app_user
      POSTGRES_PASSWORD: "EsunFinanceDB_2026!Secure"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./db/04_indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esun_app_user -d esun_financial_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sharednetwork

  redis:
    image: redis:7-alpine
    container_name: esun-financial-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sharednetwork

  backend:
    <<: *backend-common
    container_name: esun-financial-backend
    ports:
      - "8081:8080"

  backend-replica:
    <<: *backend-common
    container_name: esun-financial-backend-replica
    ports:
      - "8082:8080"

  backend-worker:
    <<: *backend-common
    container_name: esun-financial-backend-worker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: esun_financial_system
      DB_USERNAME: esun_app_user
      DB_PASSWORD: "EsunFinanceDB_2026!Secure"
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: worker

  kong:
    image: kong:3.9
    container_name: esun-financial-kong
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sharednetwork

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esun-financial-frontend
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - sharednetwork

volumes:
  postgres_data:

networks:
  sharednetwork:
    name: esun-financial-sharednetwork
